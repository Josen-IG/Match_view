# Dataset propio YOLO — genérico (cualquier partido, no solo Cirbonero-Milagres)
# 4136 fotogramas, 3308 train / 828 val (split 80/20 estratificado por partido, sin fuga).
# Fuentes: Cirbonero B vs Milagres (268) + 16 partidos de YouTube (1ª/2ª/3ª Federación
# y Preferente, 1 fotograma cada 30 s): Sevilla Atl.-Betis Dep., Talavera-Zamora,
# Antequera-Castilla, Castilla-Avilés, Alcalá-Fuenlabrada, Alcalá-Madrid C,
# Badajoz-Tenerife B, Recreativo-Antoniano, Betis C-Conil, Betis C-Sevilla C,
# Español (Jove)-Villarreal C, Galapagar-Atlético C, Cornellà-Mollerussa,
# San José-Tomelloso, Hellín-Tomelloso, Casetas-Ontiñena.
# Clases: 0=football (balón), 1=player (jugador). La 2=referee se añade en la corrección manual.
# El modelo NO clasifica equipos por color: solo detecta balón y jugador;
# los equipos se distinguen después por color de camiseta en video_track.py.
path: dataset
train: images/train
val: images/val
nc: 2
names:
  0: football
  1: player
