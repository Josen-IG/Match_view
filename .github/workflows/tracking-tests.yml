name: Tracking tests

on:
  push:
    branches:
      - feature/player-analytics-foundation
      - main
  pull_request:
    branches:
      - main

jobs:
  tracking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight test dependencies
        run: python -m pip install numpy scipy opencv-python-headless
      - name: Check Python syntax
        run: python -m compileall -q video_track.py player_tracking.py tests
      - name: Run tracking regression tests
        run: python -m unittest discover -s tests -v
